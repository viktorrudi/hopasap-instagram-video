<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .fx {
          position: absolute;
          opacity: 0;
        }
        /* Screen-space light effects for the van reveal. Local 0 = timeline 8.43 s (speed ramp starts).
           0.41 = 8.84 s impact (slow motion lands on the headlight), 1.39 = 9.82 s back to 1x,
           sheen over the van front, 2.88 = 11.31 s badge glint. */
        #hype-vignette {
          inset: 0;
          background: radial-gradient(ellipse 72% 58% at 40% 62%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.62) 100%);
        }
        #hype-leak {
          width: 1300px;
          height: 1300px;
          left: 380px;
          top: -420px;
          mix-blend-mode: screen;
          background: radial-gradient(circle, rgba(255, 120, 70, 0.55) 0%, rgba(255, 90, 54, 0.22) 38%, rgba(255, 90, 54, 0) 70%);
        }
        #hype-glow {
          width: 520px;
          height: 520px;
          left: -95px;
          top: 1190px;
          mix-blend-mode: screen;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(190, 220, 255, 0.45) 22%, rgba(140, 190, 255, 0) 62%);
        }
        .streak {
          height: 14px;
          width: 1800px;
          mix-blend-mode: screen;
          border-radius: 50%;
          background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 255, 255, 1) 0%, rgba(170, 210, 255, 0.85) 18%, rgba(110, 170, 255, 0.35) 45%, rgba(110, 170, 255, 0) 70%);
          box-shadow: 0 0 22px 6px rgba(120, 180, 255, 0.35);
        }
        /* Centred on the headlight (x 165, y 1450) and on the Opel badge (x 215, y 1475). */
        #hype-streak-a {
          top: 1443px;
          left: -735px;
        }
        #hype-streak-b {
          top: 1468px;
          left: -685px;
        }
        #hype-flash {
          inset: 0;
          background: #ffffff;
        }
        /* Light sweep over the van front (masked to the bonnet, headlight and grille, not the people). */
        #hype-sheen {
          inset: 0;
          opacity: 1;
          -webkit-mask-image: radial-gradient(ellipse 470px 560px at 290px 1300px, #000 50%, transparent 100%);
          mask-image: radial-gradient(ellipse 470px 560px at 290px 1300px, #000 50%, transparent 100%);
        }
        #sheen-band,
        #sheen-core {
          position: absolute;
          top: -500px;
          height: 2920px;
          left: 0;
          opacity: 0;
        }
        #sheen-band {
          width: 700px;
          mix-blend-mode: overlay;
          background: linear-gradient(90deg, rgba(255, 246, 232, 0) 0%, rgba(255, 246, 232, 0.22) 28%, rgba(255, 246, 232, 0.7) 50%, rgba(255, 246, 232, 0.22) 72%, rgba(255, 246, 232, 0) 100%);
        }
        #sheen-core {
          width: 140px;
          margin-left: 280px;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.36) 50%, rgba(255, 255, 255, 0) 100%);
        }
      </style>

      <div id="root" data-composition-id="car-hype" data-width="1080" data-height="1920">
        <div id="hype-vignette" class="fx"></div>
        <div id="hype-leak" class="fx" data-layout-allow-overflow></div>
        <div id="hype-sheen" class="fx">
          <div id="sheen-band" data-layout-allow-overflow></div>
          <div id="sheen-core" data-layout-allow-overflow></div>
        </div>
        <div id="hype-glow" class="fx" data-layout-allow-overflow></div>
        <div id="hype-streak-a" class="fx streak" data-layout-allow-overflow></div>
        <div id="hype-streak-b" class="fx streak" data-layout-allow-overflow></div>
        <div id="hype-flash" class="fx"></div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var HIT = 0.41; // 8.84 s: slow motion lands on the headlight
          var BACK = 1.39; // 9.82 s: speed back to 1x, sheen starts
          var BADGE = 2.88; // 11.31 s: Opel badge glint

          // Impact: white flash, anamorphic streak and bloom on the headlight.
          tl.set("#hype-flash", { opacity: 0.8 }, HIT);
          tl.to("#hype-flash", { opacity: 0, duration: 0.2, ease: "power3.out" }, HIT + 0.033);
          tl.fromTo("#hype-streak-a", { opacity: 1, scaleX: 0.05 }, { scaleX: 1, duration: 0.22, ease: "expo.out", immediateRender: false }, HIT);
          tl.to("#hype-streak-a", { opacity: 0, scaleY: 0.4, duration: 0.7, ease: "power2.in" }, HIT + 0.2);
          tl.fromTo("#hype-glow", { opacity: 1, scale: 0.4 }, { scale: 1.15, duration: 0.3, ease: "expo.out", immediateRender: false }, HIT);
          tl.to("#hype-glow", { opacity: 0, duration: 0.8, ease: "power2.in" }, HIT + 0.25);

          // Mood while the slow motion plays: vignette and a warm brand-orange light leak drifting in.
          tl.to("#hype-vignette", { opacity: 1, duration: 0.25, ease: "power2.out" }, HIT);
          tl.fromTo("#hype-leak", { opacity: 0, x: 160, y: -60 }, { opacity: 0.85, x: -40, y: 40, duration: 1.0, ease: "power1.inOut", immediateRender: false }, HIT + 0.05);
          tl.to("#hype-leak", { opacity: 0, x: -120, duration: 0.3, ease: "power2.in" }, HIT + 1.05);

          // Back to 1x: soft flash and the sheen sweeping left → right across the van front.
          tl.set("#hype-flash", { opacity: 0.3 }, BACK);
          tl.to("#hype-flash", { opacity: 0, duration: 0.16, ease: "power3.out" }, BACK + 0.033);
          tl.fromTo(["#sheen-band", "#sheen-core"], { x: -900, rotation: 16 }, { x: 1300, rotation: 16, duration: 1.2, ease: "power2.inOut", immediateRender: false }, BACK);
          tl.to(["#sheen-band", "#sheen-core"], { opacity: 1, duration: 0.2, ease: "power1.out" }, BACK);
          tl.to(["#sheen-band", "#sheen-core"], { opacity: 0, duration: 0.2, ease: "power1.in" }, BACK + 1.0);

          // Badge glint, synced with the sparkle on the Opel badge.
          tl.fromTo("#hype-streak-b", { opacity: 0.9, scaleX: 0.05 }, { scaleX: 0.8, duration: 0.2, ease: "expo.out", immediateRender: false }, BADGE);
          tl.to("#hype-streak-b", { opacity: 0, duration: 0.45, ease: "power2.in" }, BADGE + 0.17);

          // Vignette releases as the scene settles.
          tl.to("#hype-vignette", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 3.15);

          window.__timelines["car-hype"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
