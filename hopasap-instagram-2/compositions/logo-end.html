<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: #000;
        }
        /* End card on black: the logo switches on like a sign, glows in brand orange, a shine sweeps across it. */
        #end-glow {
          position: absolute;
          left: 40px;
          top: 560px;
          width: 1000px;
          height: 800px;
          opacity: 0;
          background: radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255, 90, 54, 0.38) 0%, rgba(255, 90, 54, 0.12) 45%, rgba(255, 90, 54, 0) 75%);
        }
        #end-logo {
          position: absolute;
          left: 130px;
          top: 861px;
          width: 820px;
          height: 198px;
          opacity: 0;
        }
        #end-logo-img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: contain;
          filter: drop-shadow(0 0 18px rgba(255, 90, 54, 0.35));
        }
        /* The shine is clipped to the logo's own shape. */
        #end-shine {
          position: absolute;
          inset: 0;
          -webkit-mask-image: url("assets/hopasap-logo-reversed.svg");
          mask-image: url("assets/hopasap-logo-reversed.svg");
          -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
          overflow: hidden;
        }
        #end-shine-band {
          position: absolute;
          top: -100px;
          left: 0;
          width: 160px;
          height: 400px;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.95) 50%, rgba(255, 255, 255, 0) 100%);
          transform: translateX(-300px) rotate(18deg);
        }
        #end-spark {
          position: absolute;
          left: 0;
          top: 0;
          width: 120px;
          height: 120px;
          opacity: 0;
        }
        #end-spark svg {
          width: 100%;
          height: 100%;
          overflow: visible;
          filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 24px rgba(255, 140, 100, 0.8));
        }
      </style>

      <div id="root" data-composition-id="logo-end" data-width="1080" data-height="1920">
        <div id="end-glow"></div>
        <div id="end-logo">
          <img id="end-logo-img" src="assets/hopasap-logo-reversed.svg" alt="hopasap logo" />
          <div id="end-shine"><div id="end-shine-band" data-layout-allow-overflow></div></div>
        </div>
        <div id="end-spark">
          <svg viewBox="-50 -50 100 100"><path d="M0-50C3-12 12-3 50 0C12 3 3 12 0 50C-3 12-12 3-50 0C-12-3-3-12 0-50Z" fill="#fff" /></svg>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          // Switch-on flicker, frame-accurate at 30 fps.
          var flicker = [[0, 0.7], [0.067, 0.08], [0.133, 0.9], [0.2, 0.3], [0.267, 1]];
          flicker.forEach(function (k) {
            tl.set("#end-logo", { opacity: k[1] }, k[0]);
            tl.set("#end-glow", { opacity: Math.min(1, k[1] * 1.2) }, k[0]);
          });
          tl.fromTo("#end-logo", { scale: 1.06 }, { scale: 1, duration: 0.9, ease: "expo.out", immediateRender: false }, 0);
          tl.to("#end-glow", { opacity: 0.55, duration: 0.8, ease: "power2.out" }, 0.3);
          // Shine sweeps left → right across the letters.
          tl.fromTo("#end-shine-band", { x: -300, rotation: 18 }, { x: 1000, rotation: 18, duration: 0.75, ease: "power2.inOut", immediateRender: false }, 0.6);
          // Sparkle on the logo mark.
          tl.set("#end-spark", { xPercent: -50, yPercent: -50, x: 222, y: 872, scale: 0, rotation: 0, opacity: 1 }, 0.5);
          tl.to("#end-spark", { scale: 1, rotation: 45, duration: 0.22, ease: "back.out(2)" }, 0.5);
          tl.to("#end-spark", { scale: 0, rotation: 110, duration: 0.3, ease: "power2.in" }, 0.72);
          tl.set("#end-spark", { opacity: 0 }, 1.02);
          window.__timelines["logo-end"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
