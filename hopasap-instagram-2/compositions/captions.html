<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
          overflow: visible;
        }
        /* One group on screen at a time, centred in the lower part of Instagram's safe band (168–1330 px). */
        .cap-group {
          position: absolute;
          left: 0;
          top: 1120px;
          width: 1080px;
          padding: 0 130px;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          gap: 4px 10px;
          opacity: 0;
          visibility: hidden;
          transform-origin: 50% 60%;
        }
        .w {
          position: relative;
          display: inline-block;
          padding: 6px 14px 12px;
          font-family: "Montserrat", sans-serif;
          font-weight: 800;
          font-size: 70px;
          line-height: 1.05;
          letter-spacing: -0.01em;
          color: #ffffff;
          text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), 0 6px 18px rgba(0, 0, 0, 0.55);
          transform-origin: 50% 60%;
        }
        .w .bg {
          position: absolute;
          inset: 0;
          z-index: 0;
          border-radius: 16px;
          background: #ff5a36;
          box-shadow: 0 10px 26px rgba(255, 90, 54, 0.35);
          opacity: 0;
          transform: scaleX(0);
          transform-origin: 0% 50%;
        }
        /* End-card tagline under the logo: one line. */
        .cap-tagline {
          padding: 0 50px;
          gap: 4px 6px;
        }
        .cap-tagline .w {
          font-size: 58px;
          padding: 6px 10px 10px;
        }
        .w .t {
          position: relative;
          z-index: 1;
        }
        /* The brand name: brand orange on a near-black pill (the logo's reversed look), readable on any footage. */
        .w.brand {
          color: #ff5a36;
          text-shadow: none;
        }
        .w.brand .bg {
          background: #121212;
          box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
        }
      </style>

      <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
        <div class="cap-group" id="cap-01" data-g-start="8.02" data-g-end="8.6"><span class="w" data-w-start="8.06" data-w-end="8.2"><span class="bg"></span><span class="t">Ne,</span></span><span class="w" data-w-start="8.21" data-w-end="8.45"><span class="bg"></span><span class="t">ne.</span></span></div>
        <div class="cap-group" id="cap-02" data-g-start="8.6" data-g-end="9.3"><span class="w" data-w-start="8.62" data-w-end="8.95"><span class="bg"></span><span class="t">Tohle</span></span><span class="w" data-w-start="9.02" data-w-end="9.3"><span class="bg"></span><span class="t">není</span></span></div>
        <div class="cap-group" id="cap-03" data-g-start="9.3" data-g-end="9.95"><span class="w brand" data-w-start="9.34" data-w-end="9.75"><span class="bg"></span><span class="t">hopasap.</span></span></div>
        <div class="cap-group" id="cap-04" data-g-start="9.98" data-g-end="10.8"><span class="w" data-w-start="10.05" data-w-end="10.45"><span class="bg"></span><span class="t">Pojď.</span></span></div>
        <div class="cap-group" id="cap-05" data-layout-allow-safe-zone data-g-start="11.48" data-g-end="13.2"><span class="w" data-w-start="11.52" data-w-end="11.72"><span class="bg"></span><span class="t">Tohle</span></span><span class="w" data-w-start="11.74" data-w-end="11.9"><span class="bg"></span><span class="t">je</span></span><span class="w brand" data-w-start="12.4" data-w-end="12.95"><span class="bg"></span><span class="t">hopasap!</span></span></div>
        <div class="cap-group" id="cap-06" data-layout-allow-safe-zone data-g-start="13.55" data-g-end="15.1"><span class="w" data-w-start="13.6" data-w-end="13.98"><span class="bg"></span><span class="t">Ah,</span></span><span class="w brand" data-w-start="14.4" data-w-end="14.85"><span class="bg"></span><span class="t">hopasap!</span></span></div>
        <div class="cap-group" id="cap-07" data-layout-allow-safe-zone data-g-start="15.66" data-g-end="17.0"><span class="w" data-w-start="15.71" data-w-end="15.86"><span class="bg"></span><span class="t">Tak</span></span><span class="w" data-w-start="15.86" data-w-end="16.08"><span class="bg"></span><span class="t">já</span></span><span class="w" data-w-start="16.1" data-w-end="16.42"><span class="bg"></span><span class="t">jdu</span></span><span class="w" data-w-start="16.45" data-w-end="16.68"><span class="bg"></span><span class="t">na</span></span><span class="w" data-w-start="16.7" data-w-end="16.95"><span class="bg"></span><span class="t">to.</span></span></div>
        <div class="cap-group" id="cap-08" data-layout-allow-safe-zone data-g-start="17.0" data-g-end="17.9"><span class="w" data-w-start="17.02" data-w-end="17.18"><span class="bg"></span><span class="t">Na</span></span><span class="w" data-w-start="17.18" data-w-end="17.62"><span class="bg"></span><span class="t">shledanou.</span></span></div>
        <div class="cap-group cap-tagline" id="cap-09" data-layout-allow-safe-zone data-g-start="19.86" data-g-end="23.5"><span class="w" data-w-start="19.95" data-w-end="20.15"><span class="bg"></span><span class="t">Již</span></span><span class="w" data-w-start="20.15" data-w-end="20.51"><span class="bg"></span><span class="t">brzy</span></span><span class="w" data-w-start="20.51" data-w-end="20.6"><span class="bg"></span><span class="t">v</span></span><span class="w" data-w-start="20.6" data-w-end="20.96"><span class="bg"></span><span class="t">Brně</span></span><span class="w" data-w-start="20.96" data-w-end="21.05"><span class="bg"></span><span class="t">a</span></span><span class="w" data-w-start="21.05" data-w-end="21.83"><span class="bg"></span><span class="t">okolí.</span></span></div>
      </div>

      <script>
        (function () {
          // Czech subtitles. Each group shows over [data-g-start, data-g-end) and each word's pill
          // lights over [data-w-start, data-w-end), in root-timeline seconds (this host starts at 0).
          var tl = gsap.timeline({ paused: true });
          var groups = document.querySelectorAll("#root .cap-group");
          groups.forEach(function (g) {
            var gs = parseFloat(g.getAttribute("data-g-start"));
            var ge = parseFloat(g.getAttribute("data-g-end"));
            tl.set(g, { visibility: "visible" }, gs);
            tl.fromTo(
              g,
              { opacity: 0, scale: 0.86, y: 18 },
              { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "back.out(1.6)" },
              gs
            );
            g.querySelectorAll(".w").forEach(function (w) {
              var ws = parseFloat(w.getAttribute("data-w-start"));
              var we = parseFloat(w.getAttribute("data-w-end"));
              var bg = w.querySelector(".bg");
              var inDur = Math.min(0.12, Math.max(0.05, we - ws));
              var isBrand = w.classList.contains("brand");
              // The brand word sits on its dark pill for the whole group (readable on any background).
              if (isBrand) tl.fromTo(bg, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, gs);
              else tl.to(bg, { opacity: 1, scaleX: 1, duration: inDur, ease: "power3.out" }, ws);
              tl.fromTo(w, { scale: 1 }, { scale: 1.08, duration: inDur, ease: "power2.out" }, ws);
              tl.to(w, { scale: 1, duration: 0.14, ease: "power2.inOut" }, we);
              if (!isBrand) tl.to(bg, { opacity: 0, duration: 0.1, ease: "power2.in" }, we);
            });
            tl.to(g, { opacity: 0, duration: 0.1, ease: "power2.in" }, ge - 0.1);
            tl.set(g, { opacity: 0, visibility: "hidden" }, ge);
          });
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
