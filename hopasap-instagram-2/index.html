  var tl = gsap.timeline({ paused: true });

  tl.to(cam, { scale: 1.05, duration: 0.41, ease: "power2.in" }, 8.43);

  // Sparkles on the headlight and the Opel badge: positions follow the footage (measured on the processed clip).
  function sparkle(sel, t, from, to, dur, size) {
    tl.set(sel, { xPercent: -50, yPercent: -50, x: from[0], y: from[1], scale: 0, rotation: 0, opacity: 1 }, t);
    tl.to(sel, { x: to[0], y: to[1], duration: dur, ease: "none" }, t);
    tl.to(sel, { scale: size, rotation: 45, duration: dur * 0.45, ease: "back.out(2)" }, t);
    tl.to(sel, { scale: 0, rotation: 110, duration: dur * 0.55, ease: "power2.in" }, t + dur * 0.45);
    tl.set(sel, { opacity: 0 }, t + dur);
  }
  sparkle("#spark-headlight", 8.99, [245, 1320], [345, 1318], 0.5, 1.1);
  sparkle("#spark-headlight-2", 9.15, [205, 1500], [300, 1495], 0.4, 0.55);
