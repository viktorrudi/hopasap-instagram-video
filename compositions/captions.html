      <script>
        (function () {
          // Czech subtitles. Each group shows over [data-g-start, data-g-end) and each word's pill
          // lights over [data-w-start, data-w-end), in root-timeline seconds (this host starts at 0).
          var tl = gsap.timeline({ paused: true });
          var groups = document.querySelectorAll("#root .cap-group");
          groups.forEach(function (g) {
            var gs = parseFloat(g.getAttribute("data-g-start"));
            var ge = parseFloat(g.getAttribute("data-g-end"));
            tl.set(g, { visibility: "visible" }, gs);
            tl.fromTo(
              g,
              { opacity: 0, scale: 0.86, y: 18 },
              { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "back.out(1.6)" },
              gs
            );
            g.querySelectorAll(".w").forEach(function (w) {
              var ws = parseFloat(w.getAttribute("data-w-start"));
              var we = parseFloat(w.getAttribute("data-w-end"));
              var bg = w.querySelector(".bg");
              var inDur = Math.min(0.12, Math.max(0.05, we - ws));
              var isBrand = w.classList.contains("brand");
              // The brand word sits on its dark pill for the whole group (readable on any background).
              if (isBrand) tl.fromTo(bg, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, gs);
              else tl.to(bg, { opacity: 1, scaleX: 1, duration: inDur, ease: "power3.out" }, ws);
              tl.fromTo(w, { scale: 1 }, { scale: 1.08, duration: inDur, ease: "power2.out" }, ws);
              tl.to(w, { scale: 1, duration: 0.14, ease: "power2.inOut" }, we);
              if (!isBrand) tl.to(bg, { opacity: 0, duration: 0.1, ease: "power2.in" }, we);
            });
            tl.to(g, { opacity: 0, duration: 0.1, ease: "power2.in" }, ge - 0.1);
            tl.set(g, { opacity: 0, visibility: "hidden" }, ge);
          });
          window.__timelines["captions"] = tl;
        })();
      </script>
